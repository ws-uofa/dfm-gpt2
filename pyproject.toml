[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfm-wikitext103"
version = "0.1.0"
description = "Readable GPT-2 DFM reference implementation for WikiText-103"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.30",
  "datasets>=2.18",
  "faiss-cpu>=1.8",
  "numpy>=1.26",
  "torch>=2.2",
  "transformers>=4.44",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
