[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfm-gpt2"
version = "0.1.0"
description = "Readable GPT-2 DFM reference implementation for WikiText-103"
requires-python = ">=3.10"
dependencies = [
  "accelerate==1.1.0",
  "datasets==4.8.4",
  "faiss-cpu==1.14.3",
  "numpy>=1.26,<3",
  "safetensors>=0.4,<1",
  "torch>=2.2,<3",
  "transformers==4.51.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
